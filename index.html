<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Catalog</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG Icons
        const XIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const PlusIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
            </svg>
        );

        // Translations & Mock Data
        const TRANSLATIONS = {
            en: {
                modalUnit: "Unit Price",
                modalQty: "Quantity",
                subtotal: "Subtotal",
                addCart: "Add to Cart",
                title: "Product Catalog"
            },
            es: {
                modalUnit: "Precio Unitario",
                modalQty: "Cantidad",
                subtotal: "Subtotal",
                addCart: "Añadir al Carrito",
                title: "Catálogo de Productos"
            }
        };

        const MOCK_PRODUCT = {
            id: 1,
            name: { en: "Sample Product", es: "Producto de Ejemplo" },
            description: { 
                en: "This is a high-quality sample product description to show how the modal layout works seamlessly.", 
                es: "Esta es una descripción de producto de alta calidad para mostrar cómo funciona el diseño." 
            },
            prices: { "Unidad": 19.99 },
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60"
        };

        // Zoom Image Helper Component
        const ZoomImage = ({ src, alt }) => (
            <div className="overflow-hidden rounded-2xl bg-slate-100 aspect-square flex items-center justify-center">
                <img src={src} alt={alt} className="object-cover w-full h-full hover:scale-105 transition-transform duration-300" />
            </div>
        );

        // Fixed Product Detail Modal Component
        const ProductDetailModal = ({ product, lang, onClose, onAdd }) => {
            const [quantity, setQuantity] = useState(1);

            if (!product) return null;

            const currentPrice = product.prices["Unidad"];
            const t = TRANSLATIONS[lang];
            const name = product.name[lang];
            const description = product.description[lang];

            const handleAddToCart = () => {
                onAdd(product, "Unidad", quantity);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div 
                        className="fixed inset-0 bg-[#003366]/60 backdrop-blur-sm transition-opacity duration-300" 
                        onClick={onClose} 
                    />
                    
                    <div className="relative bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl z-10 border-2 border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                        <button 
                            onClick={onClose}
                            className="absolute top-4 right-4 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors text-slate-700"
                        >
                            <XIcon className="w-5 h-5" />
                        </button>

                        <div className="mb-6">
                            <ZoomImage src={product.image} alt={name} />
                        </div>

                        <div className="mb-6">
                            <div className="flex items-center justify-between mb-2">
                                <span className="px-3 py-1 bg-red-100 text-[#ce1126] rounded-lg text-xs font-black uppercase tracking-wider">
                                    {t.modalUnit}
                                </span>
                                <span className="text-xl font-black text-slate-900">${currentPrice.toFixed(2)} CAD</span>
                            </div>
                            
                            <h3 className="text-2xl font-black text-slate-900 tracking-tight uppercase mb-2">
                                {name}
                            </h3>
                            
                            <p className="text-slate-600 text-sm font-medium leading-relaxed">
                                {description}
                            </p>
                        </div>

                        <div className="space-y-6 border-t border-slate-100 pt-6">
                            <div className="flex items-center justify-between">
                                <span className="text-xs font-bold uppercase text-slate-700">{t.modalQty}</span>
                                <div className="flex items-center gap-3 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                    <button 
                                        onClick={() => setQuantity(prev => Math.max(1, prev - 1))}
                                        className="w-9 h-9 flex items-center justify-center bg-white hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base shadow-sm"
                                    >
                                        -
                                    </button>
                                    <span className="text-base font-black w-8 text-center text-slate-900">{quantity}</span>
                                    <button 
                                        onClick={() => setQuantity(prev => prev + 1)}
                                        className="w-9 h-9 flex items-center justify-center bg-white hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base shadow-sm"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>

                            <div className="space-y-4 border-t border-slate-100 pt-4">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs text-slate-500 font-bold uppercase">{t.subtotal}</span>
                                    <span className="text-xl font-black text-slate-900">${(currentPrice * quantity).toFixed(2)} CAD</span>
                                </div>
                                
                                <button 
                                    onClick={handleAddToCart}
                                    className="w-full bg-[#ce1126] hover:bg-[#b00f20] text-white py-4 rounded-xl font-black flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg uppercase tracking-widest text-xs"
                                >
                                    <PlusIcon className="w-5 h-5 mr-1" /> {t.addCart}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [lang, setLang] = useState('en');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [cart, setCart] = useState([]);

            const handleAddToCart = (product, unit, qty) => {
                setCart(prev => [...prev, { ...product, unit, qty }]);
                alert(`Added ${qty} ${product.name[lang]} to cart!`);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6">
                    <div className="absolute top-6 right-6 flex gap-2">
                        <button 
                            onClick={() => setLang('en')} 
                            className={`px-3 py-1 rounded font-bold text-sm ${lang === 'en' ? 'bg-[#003366] text-white' : 'bg-slate-200 text-slate-700'}`}
                        >
                            EN
                        </button>
                        <button 
                            onClick={() => setLang('es')} 
                            className={`px-3 py-1 rounded font-bold text-sm ${lang === 'es' ? 'bg-[#003366] text-white' : 'bg-slate-200 text-slate-700'}`}
                        >
                            ES
                        </button>
                    </div>

                    <div className="text-center space-y-4">
                        <h1 className="text-4xl font-black text-slate-800">{TRANSLATIONS[lang].title}</h1>
                        <p className="text-slate-600">Click below to test the product details modal window.</p>
                        <button 
                            onClick={() => setIsModalOpen(true)}
                            className="bg-[#003366] text-white font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-blue-900 transition-all"
                        >
                            Open Product Modal
                        </button>
                    </div>

                    {isModalOpen && (
                        <ProductDetailModal 
                            product={MOCK_PRODUCT} 
                            lang={lang} 
                            onClose={() => setIsModalOpen(false)} 
                            onAdd={handleAddToCart} 
                        />
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
