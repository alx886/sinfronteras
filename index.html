    const ZoomImage = ({ src, alt }) => {
      const [zoomStyle, setZoomStyle] = useState({ display: 'none' });
      const [isZooming, setIsZooming] = useState(false);
      const containerRef = useRef(null);

      const handleMouseMove = (e) => {
        const { left, top, width, height } = containerRef.current.getBoundingClientRect();
        const x = ((e.pageX - left - window.scrollX) / width) * 100;
        const y = ((e.pageY - top - window.scrollY) / height) * 100;
        
        setZoomStyle({
          display: 'block',
          backgroundImage: `url(${src})`,
          backgroundPosition: `${x}% ${y}%`,
          backgroundSize: '250%'
        });
      };

      return (
        <div 
          ref={containerRef}
          className="relative overflow-hidden rounded-2xl bg-slate-100 aspect-[4/3] cursor-crosshair touch-none shadow-md border border-slate-200"
          onMouseEnter={() => setIsZooming(true)}
          onMouseLeave={() => setIsZooming(false)}
          onMouseMove={handleMouseMove}
        >
          <img 
            src={src} 
            alt={alt} 
            className={`w-full h-full object-cover transition-opacity duration-300 ${isZooming ? 'opacity-0' : 'opacity-100'}`} 
          />
          {isZooming && (
            <div 
              className="absolute inset-0 pointer-events-none transition-opacity duration-300 border-4 border-[#ce1126]/20"
              style={zoomStyle}
            />
          )}
          <div className="absolute bottom-3 right-3 bg-[#003366]/85 backdrop-blur-sm p-1.5 rounded-lg text-white">
            <SearchIcon className="w-4 h-4" />
          </div>
        </div>
      );
    };

              <div>
                <h3 className="font-black text-2xl md:text-3xl text-slate-900 leading-tight mb-2 mt-2">

                  <span className="text-slate-500 text-[10px] font-bold uppercase tracking-widest">

                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setQuantity(prev => Math.max(1, prev - 1))}
                      className="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base"
                    >
                      -
                    </button>
                    <span className="text-base font-black w-10 text-center text-slate-900">{quantity}</span>
                    <button 
                      onClick={() => setQuantity(prev => prev + 1)}
                      className="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>

              <div className="space-y-4 border-t border-slate-100 pt-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs text-slate-500 font-bold uppercase">{t.subtotal}</span>
                  <span className="text-xl font-black text-slate-900">${(currentPrice * quantity).toFixed(2)} CAD</span>
                </div>
                
                <button 
                  onClick={handleAddToCart}
                  className="w-full bg-[#ce1126] hover:bg-[#b00f20] text-white py-4 rounded-xl font-black flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg uppercase tracking-widest text-xs"
                >
                  <PlusIcon className="w-5 h-5 mr-1" /> {t.addCart}
                </button>

            </div>

            item.cartId === cartId ? { ...item, quantity: item.quantity + qtyToAdd } : item

            ...product, 
            cartId, 
            selectedSize: size, 
            price: priceForSize, 
            quantity: qtyToAdd

        }
        setIsCartOpen(true);
      };

                <p className="text-slate-300 text-xs">
                  {t.satSun} ({t.marketName}).

              </div>
            </div>
            
            <div className="max-w-7xl mx-auto border-t border-blue-900 mt-12 pt-8 text-center">

      );
    }

    const rootElement = document.getElementById('root');
