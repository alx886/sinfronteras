  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="bg-slate-50 text-slate-900">

  <div id="root"></div>

  <!-- Inline SVG Icon Components for maximum reliability -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons
    const ShoppingCartIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="8" cy="21" r="1" /><circle cx="19" cy="21" r="1" />

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>

    const PlusIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    );

    const SendIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    );

    const SearchIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    );

    const ShieldCheckIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><polyline points="9 11 11 13 15 9" />
      </svg>
    );

    const ExternalLinkIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" />
      </svg>
    );

    const HeartIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2a5.5 5.5 0 0 0-5 5.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
      </svg>
    );

    const FlameIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3.25a6.974 6.974 0 0 0 1.5 3.25z" />
      </svg>
    );

    const StarIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
    );

    // Products Data
    const PRODUCTS = [
      {
        id: 1,
        name: "Empanada Tradicional de Pino",
        description: "Rellena de jugosa carne picada seleccionada, cebolla suave, huevo duro, aceituna y especias tradicionales horneadas a la perfección.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2500, "Media Docena": 14000, "Docena": 26000
        },
        image: "https://i.ibb.co/0RkMxKrR/pino-1.jpg"
      },
      {
        id: 2,
        name: "Empanada de Queso Fundido",
        description: "Queso mantecoso estirado y fundido dentro de una masa dorada, crujiente por fuera y suave por dentro.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2200, "Media Docena": 12500, "Docena": 23000
        },
        image: "https://i.ibb.co/qL7dBRHC/queso-1.jpg"
      },
      {
        id: 3,
        name: "Empanada Queso Champiñón",
        description: "Exquisita combinación de queso mantecoso fundido con champiñones frescos salteados.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2800, "Media Docena": 15500, "Docena": 29000
        },
        image: "https://i.ibb.co/VYR92jKp/queso-champinones.jpg"
      },
      {
        id: 4,
        name: "Empanada Napolitana",
        description: "Deliciosa combinación de jamón ahumado, queso fundido, tomates maduros y un toque de orégano fresco.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2600, "Media Docena": 14500, "Docena": 27000
        },
        image: "https://i.ibb.co/27DmxVfg/Empanadas-Napolitana.png"
      },
      {
        id: 5,
        name: "Empanada Queso Jamón",
        description: "Clásica y favorita empanada rellena de generoso queso fundido y jamón de primera calidad.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2500, "Media Docena": 14000, "Docena": 26000
        },
        image: "https://i.ibb.co/WWWQ1Zzw/quesojamon.jpg"
      },
      {
        id: 6,
        name: "Empanada Queso Espinaca",
        description: "Frescas hojas de espinaca salteadas mezcladas con una suave y cremosa selección de quesos.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2600, "Media Docena": 14500, "Docena": 27000
        },
        image: "https://i.ibb.co/BVgRn3s2/queso-espinaca.jpg"
      },
      {
        id: 7,
        name: "Empanada de Atún",
        description: "Rellena de tierno atún selecto con sofrito casero de cebolla, tomate y especias.",
        sizes: ["Unidad", "Media Docena", "Docena"],
        prices: {
          "Unidad": 2900, "Media Docena": 16000, "Docena": 30000
        },
        image: "https://i.ibb.co/zhDFWkkW/empanada-atun.png"
      }
    ];

    const ZoomImage = ({ src, alt }) => {
      const [zoomStyle, setZoomStyle] = useState({ display: 'none' });
      const [isZooming, setIsZooming] = useState(false);
      const containerRef = useRef(null);

      const handleMouseMove = (e) => {
        const { left, top, width, height } = containerRef.current.getBoundingClientRect();
        const x = ((e.pageX - left - window.scrollX) / width) * 100;
        const y = ((e.pageY - top - window.scrollY) / height) * 100;
        
        setZoomStyle({
          display: 'block',
          backgroundImage: `url(${src})`,
          backgroundPosition: `${x}% ${y}%`,
          backgroundSize: '250%'
        });
      };

      return (
        <div 
          ref={containerRef}
          className="relative overflow-hidden rounded-2xl bg-slate-100 aspect-[4/3] cursor-crosshair touch-none shadow-md border border-slate-200"
          onMouseEnter={() => setIsZooming(true)}
          onMouseLeave={() => setIsZooming(false)}
          onMouseMove={handleMouseMove}
        >
          <img 
            src={src} 
            alt={alt} 
            className={`w-full h-full object-cover transition-opacity duration-300 ${isZooming ? 'opacity-0' : 'opacity-100'}`} 
          />
          {isZooming && (
            <div 
              className="absolute inset-0 pointer-events-none transition-opacity duration-300 border-4 border-[#ce1126]/20"
              style={zoomStyle}
            />
          )}
          <div className="absolute bottom-3 right-3 bg-[#003366]/85 backdrop-blur-sm p-1.5 rounded-lg text-white">
            <SearchIcon className="w-4 h-4" />
          </div>
        </div>
      );
    };

    const ProductCard = ({ product, onSelect }) => {
      const trimmedDescription = product.description.length > 80 
        ? product.description.substring(0, 80) + '...' 
        : product.description;

      return (
        <div 
          onClick={() => onSelect(product)}
          className="group flex flex-col h-full bg-white rounded-2xl p-4 shadow-sm hover:shadow-xl border-2 border-slate-200 hover:border-[#ce1126] transition-all duration-300 cursor-pointer"
        >
          <div className="relative overflow-hidden rounded-xl aspect-[4/3] bg-slate-100">
            <img 
              src={product.image} 
              alt={product.name} 
              className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
            />
          </div>
          
          <div className="mt-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 className="font-extrabold text-base text-slate-900 leading-tight tracking-tight mb-1">
                {product.name}
              </h3>
              <p className="text-[11px] text-slate-600 font-medium leading-relaxed mb-3">
                {trimmedDescription}
              </p>
            </div>
            
            <button 
              className="w-full bg-slate-100 text-slate-900 group-hover:bg-[#ce1126] group-hover:text-white py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 shadow-sm"
            >
              Ver Opciones y Precios
            </button>
          </div>
        </div>
      );
    };

    const ProductDetailModal = ({ product, onClose, onAdd }) => {
      const [selectedSize, setSelectedSize] = useState(product ? product.sizes[0] : "");
      const [quantity, setQuantity] = useState(1);

      if (!product) return null;

      const currentPrice = product.prices[selectedSize];
      const isCustomPrice = currentPrice === "CONSULTENOS";

      const handleAddToCart = () => {
        onAdd(product, selectedSize, quantity);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div 
            className="fixed inset-0 bg-[#003366]/60 backdrop-blur-sm transition-opacity duration-300" 
            onClick={onClose} 
          />
          
          <div className="relative bg-white w-full max-w-4xl rounded-[2rem] shadow-2xl p-6 md:p-8 animate-in zoom-in-95 duration-200 z-10 flex flex-col md:flex-row gap-8 overflow-hidden max-h-[90vh]">
            <button 
              onClick={onClose} 
              className="absolute top-4 right-4 p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full transition-colors z-20"
            >
              <XIcon className="w-5 h-5" />
            </button>
            
            <div className="w-full md:w-1/2 flex-shrink-0">
              <ZoomImage src={product.image} alt={product.name} />
            </div>
            
            <div className="flex-1 flex flex-col justify-between overflow-y-auto pr-1">
              <div>
                <h3 className="font-black text-2xl md:text-3xl text-slate-900 leading-tight mb-2 mt-2">
                  {product.name}
                </h3>
                
                <div className="flex items-center gap-2 mb-4">
                  {isCustomPrice ? (
                    <span className="text-xl font-black text-[#ce1126] uppercase">Consultar Valor</span>
                  ) : (
                    <span className="text-3xl font-black text-[#ce1126]">${currentPrice.toLocaleString('es-CL')}</span>
                  )}
                  <span className="text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                    {isCustomPrice ? "Preparación especial" : `Precio por ${selectedSize.toLowerCase()}`}
                  </span>
                </div>
                
                <p className="text-xs text-slate-700 font-medium leading-relaxed mb-6">
                  {product.description}
                </p>

                <div className="space-y-3 mb-6">
                  <label className="text-xs uppercase font-black text-slate-900 tracking-widest block border-b border-slate-100 pb-1">
                    Presentación / Cantidad:
                  </label>
                  <div className="flex flex-wrap gap-2">
                    {product.sizes.map(size => (
                      <button 
                        key={size}
                        onClick={() => setSelectedSize(size)}
                        className={`px-4 py-2.5 text-xs font-extrabold rounded-xl transition-all border-2 ${
                          selectedSize === size 
                          ? 'bg-[#003366] border-[#003366] text-white shadow-md' 
                          : 'bg-white border-slate-300 text-slate-900 hover:border-[#ce1126] hover:bg-slate-50'
                        }`}
                      >
                        {size}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3 mb-6">
                  <label className="text-xs uppercase font-black text-slate-900 tracking-widest block border-b border-slate-100 pb-1">
                    Cantidad de Porciones:
                  </label>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setQuantity(prev => Math.max(1, prev - 1))}
                      className="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base"
                    >
                      -
                    </button>
                    <span className="text-base font-black w-10 text-center text-slate-900">{quantity}</span>
                    <button 
                      onClick={() => setQuantity(prev => prev + 1)}
                      className="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-[#003366] hover:text-white rounded-lg transition-all font-bold text-base"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>

              <div className="space-y-4 border-t border-slate-100 pt-4">
                {!isCustomPrice && (
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-500 font-bold uppercase">Subtotal:</span>
                    <span className="text-xl font-black text-slate-900">${(currentPrice * quantity).toLocaleString('es-CL')} CLP</span>
                  </div>
                )}
                
                <button 
                  onClick={handleAddToCart}
                  className="w-full bg-[#ce1126] hover:bg-[#b00f20] text-white py-4 rounded-xl font-black flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg uppercase tracking-widest text-xs"
                >
                  <PlusIcon className="w-5 h-5 mr-1" /> Agregar al Pedido
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        address: '',
        notes: ''
      });

      const BUSINESS_PHONE = "56943854919"; // Susana & Willie's WhatsApp

      const addToCart = (product, size, qtyToAdd = 1) => {
        const priceForSize = product.prices[size];
        const cartId = `${product.id}-${size}`;
        const existing = cart.find(item => item.cartId === cartId);
        
        if (existing) {
          setCart(cart.map(item => 
            item.cartId === cartId ? { ...item, quantity: item.quantity + qtyToAdd } : item
          ));
        } else {
          setCart([...cart, { 
            ...product, 
            cartId, 
            selectedSize: size, 
            price: priceForSize, 
            quantity: qtyToAdd 
          }]);
        }
        setIsCartOpen(true);
      };

      const removeFromCart = (cartId) => {
        setCart(cart.filter(item => item.cartId !== cartId));
      };

      const updateQuantity = (cartId, delta) => {
        setCart(cart.map(item => {
          if (item.cartId === cartId) {
            const newQty = Math.max(1, item.quantity + delta);
            return { ...item, quantity: newQty };
          }
          return item;
        }));
      };

      const total = cart.reduce((sum, item) => {
        const numericPrice = typeof item.price === 'number' ? item.price : 0;
        return sum + (numericPrice * item.quantity);
      }, 0);

      const hasCustomItems = cart.some(item => item.price === "CONSULTENOS");

      const handleSendWhatsApp = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.phone) return;

        let message = `*🇨🇱 ¡NUEVO PEDIDO - SIN FRONTERAS EMPANADAS!*\n`;
        message += `👤 *Cliente:* ${formData.name}\n`;
        message += `📞 *WhatsApp:* ${formData.phone}\n`;
        if(formData.address) message += `📍 *Dirección / Entrega:* ${formData.address}\n`;
        if(formData.notes) message += `📝 *Notas:* ${formData.notes}\n`;
        message += `\n--- *DETALLE DEL PEDIDO* ---\n`;

        cart.forEach(item => {
          const formattedPrice = typeof item.price === 'number' 
            ? `$${(item.price * item.quantity).toLocaleString('es-CL')} CLP` 
            : 'A convenir';
          message += `• ${item.quantity}x ${item.name} (${item.selectedSize}) - ${formattedPrice}\n`;
        });

        message += `\n💰 *TOTAL ESTIMADO:* $${total.toLocaleString('es-CL')} CLP`;
        if (hasCustomItems) {
          message += `\n⚠️ Incluye preparaciones especiales a consultar.`;
        }
        message += `\n\n_Hola Susana y Willie, les escribo desde su página web para hacerles este pedido. ¡Quedo atento(a)!_`;

        window.open(`https://wa.me/${BUSINESS_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
          
          {/* Top National Ribbon Accent */}
          <div className="h-2 w-full bg-gradient-to-r from-[#003366] via-white to-[#ce1126]"></div>

          {/* Navigation Bar - White, Taller, Large Logo */}
          <nav className="sticky top-0 z-40 bg-white border-b-2 border-slate-200 shadow-md" aria-label="Navegación principal">
            <div className="max-w-7xl mx-auto px-6 h-28 flex items-center justify-between">
              
              <a href="#" className="flex items-center gap-4 group" aria-label="Sin Fronteras Empanadas">
                <div className="w-20 h-20 rounded-2xl flex items-center justify-center overflow-hidden shadow-md border-2 border-slate-200 bg-white shrink-0 group-hover:border-[#ce1126] transition-colors">
                  <img 
                    src="https://i.ibb.co/9PQx2SK/logo.jpg" 
                    alt="Sin Fronteras Logo" 
                    className="w-full h-full object-cover"
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = "https://placehold.co/120x120/ce1126/ffffff?text=SF";
                    }}
                  />
                </div>
                <div>
                  <h1 className="text-[#003366] font-black text-2xl tracking-tight uppercase group-hover:text-[#ce1126] transition-colors">Sin Fronteras</h1>
                  <p className="text-[#ce1126] text-xs font-black uppercase tracking-widest flex items-center gap-1 mt-0.5">
                    Empanadas Chilenas <StarIcon className="w-3.5 h-3.5 text-[#ce1126] fill-current inline" />
                  </p>
                </div>
              </a>
              
              <div className="flex items-center gap-4">
                <a 
                  href="https://www.facebook.com/p/Sin-fronteras-100043854919662/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="hidden sm:inline-flex items-center gap-2 px-5 py-3 bg-[#003366] hover:bg-[#002244] text-white rounded-xl font-extrabold text-xs uppercase tracking-wider transition-all shadow-md"
                >
                  Facebook Oficial <ExternalLinkIcon className="w-4 h-4 text-[#ce1126]" />
                </a>

                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-3.5 bg-[#ce1126] hover:bg-[#b00f20] rounded-2xl text-white transition-all shadow-lg active:scale-90 flex items-center gap-2"
                  aria-label="Ver carrito de compras"
                >
                  <ShoppingCartIcon className="w-6 h-6" />
                  <span className="hidden md:inline font-black text-xs uppercase tracking-wider">Mi Pedido</span>
                  {cart.length > 0 && (
                    <span className="absolute -top-2 -right-2 bg-[#003366] text-white text-xs font-black w-7 h-7 flex items-center justify-center rounded-full ring-2 ring-white shadow-md animate-pulse">
                      {cart.reduce((acc, curr) => acc + curr.quantity, 0)}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </nav>

          {/* Hero Section */}
          <header className="relative py-24 px-4 bg-[#003366] text-white overflow-hidden bg-cover bg-center" style={{ backgroundImage: "linear-gradient(rgba(0, 51, 102, 0.94), rgba(0, 51, 102, 0.90)), url('https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=1600&q=80')" }}>
            <div className="absolute top-0 right-0 p-12 opacity-10 pointer-events-none hidden lg:block">
              <span className="text-[12rem] font-black">🇨🇱</span>
            </div>

            <div className="relative z-10 max-w-4xl mx-auto text-center">
              <span className="inline-flex items-center gap-2 px-5 py-2.5 bg-[#ce1126]/30 text-white rounded-xl text-xs font-black uppercase tracking-[0.2em] mb-6 border border-[#ce1126]/50 shadow-md">
                <StarIcon className="w-4 h-4 text-[#ce1126] fill-current" /> Preparadas por Susana y Willie con auténtico sabor chileno
              </span>
              
              <h2 className="text-4xl md:text-7xl font-black mb-6 tracking-tight leading-none text-white">
                Empanadas tradicionales <br/>
                <span className="text-[#ce1126]">hechas con el corazón.</span>
              </h2>
              
              <p className="text-slate-200 max-w-2xl mx-auto text-lg md:text-xl font-medium leading-relaxed mb-8">
                Disfruta de nuestras exquisitas empanadas caseras. Elige tus favoritas, arma tu pedido y haz tu encargo directo por WhatsApp con nosotros.
              </p>

              <div className="flex flex-wrap items-center justify-center gap-4">
                <a 
                  href="https://www.facebook.com/p/Sin-fronteras-100043854919662/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="px-6 py-4 bg-[#ce1126] hover:bg-[#b00f20] text-white font-black rounded-xl uppercase tracking-wider text-xs transition-all shadow-lg inline-flex items-center gap-2 border border-red-500"
                >
                  Visítanos en Facebook <ExternalLinkIcon className="w-4 h-4" />
                </a>
              </div>
            </div>
          </header>

          {/* Trust Pillars */}
          <section className="bg-white border-b border-slate-200 py-16 px-4">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
              
              <div className="flex flex-col items-center text-center p-6 bg-slate-50/80 rounded-3xl border-2 border-slate-200 shadow-sm">
                <div className="w-14 h-14 rounded-2xl bg-red-100 flex items-center justify-center text-[#ce1126] mb-4 shadow-sm">
                  <FlameIcon className="w-7 h-7" />
                </div>
                <h3 className="font-black text-base text-slate-900 uppercase tracking-tight mb-2">100% Artesanales</h3>
                <p className="text-xs text-slate-600 font-medium leading-relaxed">
                  Masa estirada a mano e ingredientes frescos seleccionados cada día para garantizar el auténtico sabor tradicional.
                </p>
              </div>

              <div className="flex flex-col items-center text-center p-6 bg-slate-50/80 rounded-3xl border-2 border-slate-200 shadow-sm">
                <div className="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center text-[#003366] mb-4 shadow-sm">
                  <HeartIcon className="w-7 h-7" />
                </div>
                <h3 className="font-black text-base text-slate-900 uppercase tracking-tight mb-2">Sazón de Susana y Willie</h3>
                <p className="text-xs text-slate-600 font-medium leading-relaxed">
                  Recetas chilenas preparadas con dedicación familiar y cariño incondicional en cada preparación.
                </p>
              </div>

              <div className="flex flex-col items-center text-center p-6 bg-slate-50/80 rounded-3xl border-2 border-slate-200 shadow-sm sm:col-span-2 lg:col-span-1">
                <div className="w-14 h-14 rounded-2xl bg-red-100 flex items-center justify-center text-[#ce1126] mb-4 shadow-sm">
                  <ShieldCheckIcon className="w-7 h-7" />
                </div>
                <h3 className="font-black text-base text-slate-900 uppercase tracking-tight mb-2">Pedidos Directos</h3>
                <p className="text-xs text-slate-600 font-medium leading-relaxed">
                  Coordinación rápida y personalizada por WhatsApp para asegurar tus empanadas calentitas en la mesa.
                </p>
              </div>

            </div>
          </section>

          {/* Catalog Grid */}
          <main className="max-w-7xl mx-auto px-4 py-20">
            <div className="flex items-center gap-6 mb-16">
              <h2 className="text-3xl font-black text-slate-900 uppercase tracking-tight shrink-0">Nuestro Menú</h2>
              <div className="h-2 bg-[#ce1126] w-24 rounded-full"></div>
              <div className="h-px bg-slate-300 flex-1"></div>
            </div>
            
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
              {PRODUCTS.map(product => (
                <ProductCard 
                  key={product.id} 
                  product={product} 
                  onSelect={(prod) => setSelectedProduct(prod)} 
                />
              ))}
            </div>
          </main>

          {/* Product Detail Modal */}
          {selectedProduct && (
            <ProductDetailModal 
              product={selectedProduct} 
              onClose={() => setSelectedProduct(null)} 
              onAdd={addToCart} 
            />
          )}

          {/* Slide-out Cart Panel */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end" role="dialog" aria-modal="true">
              <div className="absolute inset-0 bg-[#003366]/60 backdrop-blur-sm" onClick={() => setIsCartOpen(false)} />
              
              <div className="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col animate-in slide-in-from-right duration-500">
                <div className="p-6 border-b-4 border-[#ce1126] flex items-center justify-between bg-[#003366] text-white">
                  <div>
                    <h3 className="font-black text-2xl uppercase tracking-tight">Tu Pedido</h3>
                    <p className="text-xs text-red-300 font-bold uppercase tracking-widest mt-1">Sin Fronteras • Chile</p>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="p-2 hover:bg-[#002244] rounded-full transition-colors text-white">
                    <XIcon className="w-6 h-6" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50">
                  {cart.length === 0 ? (
                    <div className="text-center py-32">
                      <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm border-2 border-dashed border-slate-300 text-slate-400 font-black text-2xl">
                        SF
                      </div>
                      <p className="text-slate-900 font-black text-xl">Tu carro está vacío</p>
                      <p className="text-slate-500 mt-1 text-sm">Selecciona tus empanadas favoritas del menú</p>
                    </div>
                  ) : (
                    cart.map(item => {
                      const isCustom = item.price === "CONSULTENOS";
                      return (
                        <div key={item.cartId} className="flex gap-4 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm">
                          <img src={item.image} className="w-20 h-20 object-cover rounded-xl shrink-0" alt={item.name} />
                          <div className="flex-1">
                            <h4 className="font-black text-slate-900 text-sm uppercase leading-tight">{item.name}</h4>
                            <p className="text-[11px] font-bold text-[#ce1126] uppercase mt-1">Presentación: {item.selectedSize}</p>
                            <div className="flex items-center justify-between mt-3">
                              <div className="flex items-center gap-1 bg-slate-100 rounded-lg p-1 border border-slate-200">
                                <button onClick={() => updateQuantity(item.cartId, -1)} className="w-7 h-7 flex items-center justify-center bg-white hover:bg-[#003366] hover:text-white rounded-md transition-all font-bold">-</button>
                                <span className="text-xs font-black w-6 text-center text-slate-900">{item.quantity}</span>
                                <button onClick={() => updateQuantity(item.cartId, 1)} className="w-7 h-7 flex items-center justify-center bg-white hover:bg-[#003366] hover:text-white rounded-md transition-all font-bold">+</button>
                              </div>
                              <span className="font-black text-sm text-slate-900">
                                {isCustom ? "A convenir" : `$${(item.price * item.quantity).toLocaleString('es-CL')}`}
                              </span>
                            </div>
                          </div>
                          <button onClick={() => removeFromCart(item.cartId)} className="text-slate-400 hover:text-[#ce1126] transition-colors p-1">
                            <XIcon className="w-5 h-5" />
                          </button>
                        </div>
                      );
                    })
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 border-t border-slate-200 bg-white shadow-2xl">
                    <div className="space-y-3 mb-4">
                      <div>
                        <label className="text-[10px] font-black uppercase text-slate-900 mb-1 block tracking-wider">Tu Nombre</label>
                        <input 
                          type="text" 
                          placeholder="Ej: Carlos Pérez" 
                          className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-[#ce1126] outline-none"
                          value={formData.name}
                          onChange={e => setFormData({...formData, name: e.target.value})}
                        />
                      </div>
                      
                      <div>
                        <label className="text-[10px] font-black uppercase text-slate-900 mb-1 block tracking-wider">WhatsApp de Contacto</label>
                        <input 
                          type="tel" 
                          placeholder="Ej: +56 9 1234 5678" 
                          className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-[#ce1126] outline-none"
                          value={formData.phone}
                          onChange={e => setFormData({...formData, phone: e.target.value})}
                        />
                      </div>

                      <div>
                        <label className="text-[10px] font-black uppercase text-slate-900 mb-1 block tracking-wider">Dirección de Entrega / Notas</label>
                        <input 
                          type="text" 
                          placeholder="Ej: Retiro en local / Dirección" 
                          className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-[#ce1126] outline-none"
                          value={formData.address}
                          onChange={e => setFormData({...formData, address: e.target.value})}
                        />
                      </div>
                    </div>

                    <div className="flex items-center justify-between py-4 border-t border-dashed border-slate-200 mb-4">
                      <span className="text-slate-600 font-bold uppercase text-xs">Total Estimado</span>
                      <span className="text-2xl font-black text-slate-900">${total.toLocaleString('es-CL')}</span>
                    </div>

                    <button 
                      onClick={handleSendWhatsApp}
                      disabled={!formData.name || !formData.phone}
                      className="w-full bg-[#25D366] hover:bg-[#1da851] disabled:opacity-40 text-white py-4 rounded-xl font-black flex items-center justify-center gap-3 transition-all shadow-lg uppercase tracking-wider text-xs"
                    >
                      <SendIcon className="w-5 h-5 fill-current" /> Enviar Pedido por WhatsApp
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer Component */}
          <footer className="bg-[#003366] text-white py-16 px-4 border-t-4 border-[#ce1126]">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">
              <div>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-xl flex items-center justify-center overflow-hidden border-2 border-white/20 bg-white">
                    <img 
                      src="https://i.ibb.co/9PQx2SK/logo.jpg" 
                      alt="Sin Fronteras Logo" 
                      className="w-full h-full object-cover"
                    />
                  </div>
                  <h4 className="text-lg font-black uppercase tracking-tight">Sin Fronteras</h4>
                </div>
                <p className="text-slate-300 text-sm leading-relaxed">
                  Empanadas chilenas artesanales preparadas con dedicación por Susana y Willie. Sabor casero sin límites.
                </p>
              </div>
              
              <div>
                <h4 className="text-sm font-black uppercase tracking-widest text-[#ce1126] mb-4">Redes Sociales</h4>
                <a 
                  href="https://www.facebook.com/p/Sin-fronteras-100043854919662/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-2 text-slate-200 hover:text-white font-bold text-sm bg-[#002244] px-4 py-2.5 rounded-xl border border-blue-900 shadow-sm"
                >
                  Visita nuestra página de Facebook <ExternalLinkIcon className="w-4 h-4 text-[#ce1126]" />
                </a>
              </div>

              <div>
                <h4 className="text-sm font-black uppercase tracking-widest text-[#ce1126] mb-4">Contacto & Pedidos</h4>
                <p className="text-slate-300 text-sm font-medium">
                  Comunícate directamente con nosotros a través de nuestro WhatsApp de pedidos para coordinar entregas y disponibilidad.
                </p>
              </div>
            </div>
            
            <div className="max-w-7xl mx-auto border-t border-blue-900 mt-12 pt-8 text-center">
              <p className="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">© 2026 SIN FRONTERAS EMPANADAS • SUSANA Y WILLIE 🇨🇱</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App Component safely
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
